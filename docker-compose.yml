version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: proteinfold-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CHECKPOINT_PATH=best_model_bigru_v10.pth
      - DEVICE=cpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - proteinfold-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: proteinfold-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proteinfold-net

networks:
  proteinfold-net:
    driver: bridge
